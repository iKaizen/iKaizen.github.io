<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Connect</title>
<meta name="description" content="Color Connect: drag to link matching colors and fill every cell. Endless puzzles, no fail state.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --top:#8C7BFF; --bot:#3A22C9; --ink:#1A1240; --gold:#FFE58A; }
  body { margin:0; min-height:100vh; font-family:"Baloo 2",system-ui,sans-serif; color:#fff; text-align:center;
         background:linear-gradient(var(--top),var(--bot)) fixed; display:flex; flex-direction:column;
         align-items:center; justify-content:center; padding:24px 16px; box-sizing:border-box; }
  h1 { font-size:clamp(44px,12vw,72px); margin:0; line-height:1; text-shadow:0 3px 0 var(--ink); }
  p { font-size:20px; max-width:420px; }
  a.btn { display:inline-block; margin-top:12px; padding:16px 28px; border-radius:20px; background:#fff; color:var(--ink);
          font:800 20px "Baloo 2",system-ui,sans-serif; text-decoration:none; border:3px solid var(--ink); box-shadow:0 6px 0 var(--ink); }
  footer { margin-top:32px; font-size:15px; opacity:.85; }
  footer a { color:var(--gold); }
</style>
</head>
<body>
  <h1>Color Connect</h1>
  <p>Drag to link matching colors and fill every cell. Endless puzzles, no fail state.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.colorconnect.flow&amp;referrer=utm_source%3Dsite%26utm_medium%3Dhome">Get it on Google Play</a>
  <footer><a href="/color-connect-privacy/">Privacy policy</a></footer>
</body>
</html>
